[project]
name = "chilean-legal-mcp"
version = "0.1.0"
description = "Servidor MCP de investigación legal chilena: legislación y jurisprudencia con fuentes verificables"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "mcp>=1.2",
    "python-docx>=1.1",
    "pypdf>=4.0",
    "reportlab>=4.0",
]

[project.optional-dependencies]
semantic = ["sentence-transformers>=3.0", "numpy"]
pdf = ["weasyprint>=69.0"]
anti-bot = [
    "wafer-py>=0.3",
    "curl_cffi>=0.7",
    "camoufox>=0.5",
    "wafw00f>=2.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
chilean-legal-mcp = "chilean_legal_mcp.server:main"
